<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المهام اليومية/</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="notification-banner" class="hidden"></div>

    <div id="todo-view" class="container">
        
        <div class="app-notice">
            <span class="notice-icon">🚀</span>
            <p>
               رابط الموقع الجديد
                <br>
                <a href="https://unique-to-do-website.onrender.com"  class="ad-link">جرب الموقع الجديد من هنا</a>
            </p>
        </div>
        <h1>رابط الموقع الجديد بلاخضر فوك مباشرة</h1>
        <ul id="task-list"></ul>
        <div class="input-group">
            <input type="text" id="main-input" placeholder="إضافة مهمة جديدة..." autocomplete="off">
            <button id="submit-btn">إضافة</button>
        </div>
    </div>

    <div id="chat-view" class="container hidden">
        <div id="chat-header">
            <h2>"يابه بدلت الموقع الرابط بلواجهة"</h2>
            <span id="typing-indicator" class="hidden">شخص ما يكتب...</span>
        </div>
        <div id="chat-messages"></div>
        <div class="input-group">
            <input type="text" id="chat-input" placeholder="لا تكتب ترى بدلت الموقع صدك جذب.." autocomplete="off">
            <button id="send-btn">إرسال</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
